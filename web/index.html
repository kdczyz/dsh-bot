<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BotScreen 控制台</title>
<style>
  :root {
    --bg: #0d1013;
    --panel: #15191d;
    --panel-2: #1b2126;
    --line: #262e35;
    --text: #d7dee4;
    --dim: #7d8a94;
    --accent: #46b39d;
    --warn: #d9a441;
    --danger: #d05c5c;
    --blue: #4a8fc7;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 20;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .12em; font-weight: 600; font-family: var(--mono); }
  header h1 span { color: var(--accent); }
  .led { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .spacer { flex: 1; }
  .stat { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .stat b { color: var(--text); font-weight: 500; }
  button {
    font-family: inherit; font-size: 12px; cursor: pointer;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 6px 11px;
    transition: .13s border-color, .13s background, .13s color;
  }
  button:hover:not(:disabled) { border-color: #3d4952; background: #202830; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { border-color: #2f6f62; color: #8fe0cd; }
  button.warn { border-color: #6b5426; color: #e8c37a; }
  button.danger { border-color: #6d3333; color: #eda1a1; }
  button.brake { border-color: #7d2b2b; background: #2a1416; color: #ff9d9d; font-weight: 600; }

  main { padding: 20px 22px 60px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .card.human { border-color: #7a5a20; }
  .card.frozen { border-color: #2a3b47; }
  .card-head {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  .card-head .id { font-family: var(--mono); font-weight: 600; letter-spacing: .04em; }
  .card-head .geo { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .badge {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
    padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim);
  }
  .badge.AGENT_ACTIVE { color: #8fe0cd; border-color: #2f6f62; background: #12261f; }
  .badge.FROZEN { color: #8fb6cf; border-color: #2c4457; background: #111b23; }
  .badge.HUMAN_TAKEOVER { color: #e8c37a; border-color: #6b5426; background: #241d10; }
  .badge.NEED_HUMAN { color: #ffab8f; border-color: #6d3f2f; background: #251510; }
  .badge.STOPPED { color: #8b8b8b; }
  .badge.STARTING { color: #9fc0e0; }

  .screen {
    position: relative; aspect-ratio: 16 / 9; background: #070a0c;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .screen img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .screen .placeholder { font-family: var(--mono); font-size: 11.5px; color: #4d5c67; text-align: center; padding: 0 20px; }
  .screen .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(7,10,12,.82); font-family: var(--mono); font-size: 12px; color: #8fb6cf;
    letter-spacing: .05em; text-align: center; padding: 12px;
  }
  .screen .live {
    position: absolute; top: 8px; left: 8px; font-family: var(--mono); font-size: 10px;
    padding: 2px 6px; border-radius: 3px; background: rgba(70,179,157,.16);
    color: #8fe0cd; border: 1px solid #2f6f62;
  }
  .meta {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    border-top: 1px solid var(--line); font-family: var(--mono); font-size: 11px;
  }
  .meta div { padding: 7px 10px; border-right: 1px solid var(--line); color: var(--dim); }
  .meta div:last-child { border-right: 0; }
  .meta b { display: block; color: var(--text); font-weight: 500; font-size: 11.5px; }
  .actions { display: flex; flex-wrap: wrap; gap: 7px; padding: 11px 14px; border-top: 1px solid var(--line); }
  .help-note {
    padding: 9px 14px; border-top: 1px solid var(--line);
    font-size: 12px; color: #ffab8f; background: #1c1210; font-family: var(--mono);
  }

  dialog {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 9px; padding: 0; width: min(1120px, 94vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.72); }
  .dlg-head {
    display: flex; align-items: center; gap: 12px; padding: 11px 15px;
    border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  .dlg-head .id { font-family: var(--mono); font-weight: 600; }
  .dlg-body { padding: 0; background: #070a0c; }
  .dlg-note { padding: 18px 16px; font-size: 13px; color: #9fb0bb; line-height: 1.7; }
  .dlg-note a, .dlg-note b { color: #8fe0cd; font-family: var(--mono); }
  .dlg-note code { font-family: var(--mono); font-size: 11.5px; color: #7d8a94; word-break: break-all; }
  .dlg-foot { display: flex; gap: 8px; padding: 11px 15px; border-top: 1px solid var(--line); flex-wrap: wrap; }

  .hbanner {
    margin: 0 22px 0; padding: 9px 14px; border-radius: 6px; font-size: 12.5px;
    border: 1px solid #6b5426; background: #241d10; color: #e8c37a;
    font-family: var(--mono); display: none;
  }
  .hbanner.show { display: block; }
  .log { margin-top: 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
  .log h2 { margin: 0; padding: 11px 14px; font-size: 12px; letter-spacing: .1em; font-family: var(--mono); color: var(--dim); border-bottom: 1px solid var(--line); font-weight: 500; }
  .log pre {
    margin: 0; padding: 12px 14px; max-height: 240px; overflow: auto;
    font-family: var(--mono); font-size: 11.5px; color: #9fb0bb; white-space: pre-wrap;
  }
  .toast {
    position: fixed; right: 18px; bottom: 18px; background: var(--panel-2);
    border: 1px solid var(--line); border-left: 2px solid var(--accent);
    padding: 10px 14px; border-radius: 6px; font-size: 12.5px; font-family: var(--mono);
    max-width: 420px; opacity: 0; transform: translateY(6px); transition: .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { border-left-color: var(--danger); }
</style>
</head>
<body>
<header>
  <span class="led"></span>
  <h1>BOTSCREEN<span>/GATEWAY</span></h1>
  <div class="spacer"></div>
  <div class="stat" id="summary">—</div>
  <button class="danger" id="brakeAll">全局紧急制动</button>
</header>

<main>
  <div class="hbanner" id="hbanner"></div>
  <div class="grid" id="grid"></div>
  <div class="log">
    <h2>操作审计 / EVENT STREAM</h2>
    <pre id="logbox">等待事件…</pre>
  </div>
</main>

<dialog id="viewer">
  <div class="dlg-head">
    <span class="id" id="viewerTitle">—</span>
    <span class="badge" id="viewerBadge">—</span>
    <div class="spacer" style="flex:1"></div>
    <button id="viewerRelease" class="primary">交还给 Agent</button>
    <button id="viewerClose">关闭</button>
  </div>
  <div class="dlg-body dlg-note" id="viewerNote"></div>
  <div class="dlg-foot"><span class="stat" id="viewerHint"></span></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const state = { screens: [], shots: {}, viewerBot: null, viewerToken: null, tick: 0 };

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.className = 'toast'), 3600);
}

function logLine(msg) {
  const box = $('#logbox');
  const stamp = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const prev = box.textContent === '等待事件…' ? '' : box.textContent;
  const lines = (prev + `\n[${stamp}] ${msg}`).trim().split('\n').slice(-40);
  box.textContent = lines.join('\n');
  box.scrollTop = box.scrollHeight;
}

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const ct = res.headers.get('content-type') || '';
  const body = ct.includes('json') ? await res.json() : await res.text();
  if (!res.ok) {
    const msg = typeof body === 'object' ? (body.detail || JSON.stringify(body)) : body;
    throw new Error(`${res.status} ${msg}`.slice(0, 220));
  }
  return body;
}

function fmtBytes(n) {
  if (!n) return '0';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(v < 10 && i > 0 ? 1 : 0)}${u[i]}`;
}

async function refresh() {
  try {
    const data = await api('/api/screens');
    state.screens = data.screens;
    state.host = data.host || null;
    render();
  } catch (e) { toast('刷新失败：' + e.message, true); }
}

function render() {
  const grid = $('#grid');
  grid.replaceChildren();
  const active = state.screens.filter(s => s.state === 'AGENT_ACTIVE').length;
  const frozen = state.screens.filter(s => s.state === 'FROZEN').length;
  const human = state.screens.filter(s => s.state === 'HUMAN_TAKEOVER' || s.state === 'NEED_HUMAN').length;
  const mem = state.screens.reduce((a, s) => a + (s.memory_bytes || 0), 0);
  const host = state.host;
  const hostBit = host && host.available_mb != null
    ? ` · 宿主可用 <b>${host.available_mb}MB</b>` : '';
  $('#summary').innerHTML =
    `共 <b>${state.screens.length}</b> 屏 · 活跃 <b>${active}</b> · 冻结 <b>${frozen}</b> · 人工 <b>${human}</b> · 屏内存 <b>${fmtBytes(mem)}</b>` + hostBit;

  const banner = $('#hbanner');
  if (host && host.blocker) {
    banner.textContent = '⚠ ' + host.blocker;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }

  for (const s of state.screens) grid.appendChild(renderCard(s));

  if (state.viewerBot) {
    const cur = state.screens.find(x => x.bot_id === state.viewerBot);
    if (cur) {
      $('#viewerBadge').textContent = cur.state;
      $('#viewerBadge').className = 'badge ' + cur.state;
    }
  }
}

function renderCard(s) {
  const card = el('div', 'card ' + (s.state === 'HUMAN_TAKEOVER' || s.state === 'NEED_HUMAN' ? 'human' : s.state === 'FROZEN' ? 'frozen' : ''));
  card.dataset.bot = s.bot_id;

  const head = el('div', 'card-head');
  head.append(el('span', 'id', s.bot_id));
  const badge = el('span', 'badge ' + s.state, s.state);
  head.append(badge);
  head.append(el('span', 'geo', `${s.display} · :${s.ws_port}`));
  head.append(el('div', 'spacer'));
  const runMark = !s.healthy ? 'stopped'
    : s.cgroup_frozen ? 'cgroup.freeze=1' : 'running';
  const frozenMark = el('span', 'geo', runMark);
  head.append(frozenMark);
  card.append(head);

  const screen = el('div', 'screen');
  const shot = state.shots[s.bot_id];
  if (s.state === 'STOPPED' || !s.healthy) {
    if (shot) {
      const img = el('img');
      img.src = shot;
      img.style.opacity = '0.4';
      img.alt = s.bot_id + ' saved screen';
      screen.append(img);
      screen.append(el('div', 'overlay', s.has_saved_session
        ? '已自动关闭 · 内存/CPU 已释放\n桌面窗口与标签页已保存，按需启动后自动恢复'
        : '已关闭 · 内存/CPU 已释放'));
    } else {
      screen.append(el('div', 'placeholder', s.has_saved_session
        ? '已自动关闭（内存/CPU 0）· 桌面现场已保存\n点击「接管」或「启动」按需恢复'
        : '已关闭（内存/CPU 0）· 点击「接管」或「启动」按需拉起'));
    }
  } else if (shot) {
    const img = el('img');
    img.src = shot;
    img.alt = s.bot_id + ' screen';
    screen.append(img);
    if (s.state === 'HUMAN_TAKEOVER') screen.append(el('div', 'overlay', '人 类 接 管 中\nAgent 键鼠已锁定'));
    if (s.state === 'NEED_HUMAN') screen.append(el('div', 'overlay', 'Agent 请求人工介入'));
  } else {
    screen.append(el('div', 'placeholder', '截取中…'));
  }
  card.append(screen);

  const meta = el('div', 'meta');
  const cells = [
    ['IDLE', s.idle_seconds == null ? '∞' : `${s.idle_seconds}s`],
    ['MEM', fmtBytes(s.memory_bytes)],
    ['LEASE', `${s.holder || 'agent'} #${s.epoch ?? 0}`],
    ['PID', (s.pids || []).length],
  ];
  meta.replaceChildren();
  for (const [k, v] of cells) {
    const d = el('div', '', k);
    d.append(el('b', '', String(v)));
    meta.append(d);
  }
  card.append(meta);

  const actions = el('div', 'actions');
  actions.append(btn('启动', s.state !== 'STOPPED' && s.healthy, () => act(s.bot_id, 'start', '已按需拉起并恢复现场')));
  actions.append(btn('关闭释放', !s.healthy, () => act(s.bot_id, 'stop', '已保存现场并关闭释放内存与 CPU')));
  actions.append(btn('接管', false, () => takeover(s.bot_id), 'warn'));
  actions.append(btn('缩小归还', false, () => act(s.bot_id, 'release', '已归还 Agent'), 'primary'));
  actions.append(btn('截图', !s.healthy, () => snap(s.bot_id)));
  actions.append(btn('审计', false, () => showAudit(s.bot_id)));
  actions.append(btn('制动', !s.healthy, () => brake(s.bot_id), 'danger'));
  card.append(actions);

  if (s.help_reason) card.append(el('div', 'help-note', `求助原因：${s.help_reason}`));
  return card;
}

function btn(label, disabled, fn, cls) {
  const b = el('button', cls || '', label);
  if (disabled) b.disabled = true;
  else b.onclick = () => fn().catch(e => toast(e.message, true));
  return b;
}

async function act(bot, action, okMsg) {
  await api(`/api/screens/${bot}/${action}`, { method: 'POST' });
  toast(`${bot} ${okMsg}`);
  logLine(`${bot} ${action} ✓`);
  await refresh();
  snap(bot);
}

async function snap(bot) {
  const entry = state.screens.find(s => s.bot_id === bot);
  if (!entry || !entry.healthy || entry.state === 'FROZEN' || entry.state === 'STOPPED') return;
  try {
    const res = await fetch(`/api/screens/${bot}/preview`);
    if (!res.ok) return;
    const blob = await res.blob();
    state.shots[bot] = URL.createObjectURL(blob);
    const card = document.querySelector(`.card[data-bot="${bot}"] .screen`);
    if (card) {
      card.replaceChildren();
      const img = el('img');
      img.src = state.shots[bot];
      card.append(img);
      const st = state.screens.find(s => s.bot_id === bot);
      if (st && st.state === 'HUMAN_TAKEOVER') card.append(el('div', 'overlay', '人 类 接 管 中'));
    }
  } catch (e) { /* 预览失败不打扰 */ }
}

async function takeover(bot) {
  const res = await api(`/api/screens/${bot}/takeover`, { method: 'POST' });
  state.viewerBot = bot;
  state.viewerToken = res.token;
  $('#viewerTitle').textContent = `${bot} · ${res.state}`;
  $('#viewerBadge').textContent = res.state;
  $('#viewerBadge').className = 'badge ' + res.state;
  $('#viewerNote').innerHTML =
    `已切换到 <b>HUMAN_TAKEOVER</b>，Agent 的键鼠调用会收到 <b>423 Locked</b>。<br>` +
    `接管窗口在新标签页打开（KasmVNC 前端检测到 iframe 嵌套会退化为 VDI 模式，` +
    `因此内嵌画面只做只读旁观，实时操控走顶层窗口）。<br>` +
    `会话令牌：<code>${res.token}</code> · 有效 ${res.expires_in}s`;
  $('#viewerHint').textContent = `若新窗口被拦截，请手动打开 ${res.stream_url}`;
  $('#viewer').showModal();
  window.open(res.stream_url, `botscreen_${bot}`, 'width=1320,height=800');
  logLine(`${bot} takeover ✓ token=${res.token.slice(0, 8)}…`);
  await refresh();
}

async function brake(bot) {
  await api(`/api/screens/${bot}/brake`, { method: 'POST' });
  toast(`${bot} 已紧急制动，token 轮换`);
  logLine(`${bot} BRAKE ✓`);
  await refresh();
}

async function showAudit(bot) {
  const data = await api(`/api/screens/${bot}/audit?limit=20`);
  const lines = data.entries.map(e =>
    `${e.iso} ${e.action.padEnd(12)} ${e.state || '-'} ${JSON.stringify(
      Object.fromEntries(Object.entries(e).filter(([k]) =>
        !['ts', 'iso', 'bot_id', 'action', 'state', 'thumb'].includes(k))))}`);
  logLine(`${bot} 审计最近 ${lines.length} 条：\n` + lines.join('\n'));
}

$('#viewerClose').onclick = () => { $('#viewer').close(); state.viewerBot = null; };
$('#viewerRelease').onclick = async () => {
  const bot = state.viewerBot;
  if (!bot) return;
  await api(`/api/screens/${bot}/release`, { method: 'POST' });
  $('#viewer').close();
  state.viewerBot = null;
  toast(`${bot} 已交还 Agent`);
  logLine(`${bot} release ✓`);
  await refresh();
};
$('#brakeAll').onclick = async () => {
  const res = await api('/api/brake', { method: 'POST' });
  toast(`全局制动：${res.frozen.length} 屏已冻结`);
  logLine(`GLOBAL BRAKE ✓ ${res.frozen.join(',')}`);
  await refresh();
};

refresh();
setInterval(() => {
  state.tick++;
  if (state.tick % 2 === 0) refresh();
  for (const s of state.screens) if (s.healthy && s.state !== 'STOPPED') snap(s.bot_id);
}, 2500);
</script>
</body>
</html>
